# Vorlage fuer /etc/nginx/sites-available/apps-homepage
# "example.com" ueberall durch die echte Domain ersetzen.
#
# Voraussetzung fuer den 443-Block: TLS-Zertifikat via certbot, z.B.
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot certonly --nginx -d example.com
# Danach liegen die Zertifikate unter /etc/letsencrypt/live/example.com/.

# Websocket-Upgrade nur setzen, wenn der Client tatsaechlich upgraden will
# (Next.js Dev-/HMR- und andere Websocket-Verbindungen).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# HTTP: nur ACME-Challenge beantworten, alles andere auf HTTPS umleiten.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "http2" in der listen-Zeile: kompatibel mit aelteren nginx-Versionen
    # (die separate Direktive "http2 on;" gibt es erst ab nginx 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS erst aktivieren, wenn HTTPS stabil laeuft.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /mtg {
        return 301 /mtg/;
    }

    location = /claro {
        return 301 /claro/;
    }

    location /claro/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}
